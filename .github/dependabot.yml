version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      npm-production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    ignore:
      # Keep the optional alignment stack installable on Python 3.13.
      - dependency-name: "numpy"
        versions:
          - ">=2.3.0"
      - dependency-name: "torch"
        versions:
          - "2.12.0"
    groups:
      python-core-minor-patch:
        patterns:
          - "jsonschema"
        update-types:
          - "minor"
          - "patch"
      python-alignment-minor-patch:
        patterns:
          - "whisperx"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/services/kokoro_tts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      kokoro-python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
      - "kokoro"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/services/cosyvoice_cache"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      cosyvoice-python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
      - "cosyvoice"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
