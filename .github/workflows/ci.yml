name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server secret boundary check
        run: |
          if grep -R "SERVICE_ROLE_KEY" src public --exclude-dir=node_modules; then
            echo "Server-only Supabase role keys must stay out of client/public code."
            exit 1
          fi

      - name: Run tests
        run: npm run test -- --reporter=verbose

      - name: Build
        run: npm run build
