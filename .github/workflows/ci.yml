name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - product/input-2
  push:
    branches:
      - product/input-2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server secret boundary check
        run: |
          if grep -R "SERVICE_ROLE_KEY" src public --exclude-dir=node_modules; then
            echo "Server-only Supabase role keys must stay out of client/public code."
            exit 1
          fi

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run mobile E2E guard
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:mobile

      - name: Upload Playwright failure artifacts
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mobile-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
