name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Web Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server secret boundary check
        run: |
          if grep -R "SERVICE_ROLE_KEY" src public --exclude-dir=node_modules; then
            echo "Server-only Supabase role keys must stay out of client/public code."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (high and critical)
        run: npm audit --audit-level=high
