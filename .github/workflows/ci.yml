name: CI

on:
  push:
    branches: [main, product/input-2]
  pull_request:
    branches: [main, product/input-2]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server secret boundary check
        run: |
          if grep -R "SERVICE_ROLE_KEY" src public --exclude-dir=node_modules; then
            echo "Server-only Supabase role keys must stay out of client/public code."
            exit 1
          fi

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile E2E guard
        run: npm run test:e2e:mobile

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mobile-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
