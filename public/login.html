<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183b69" />
    <meta name="application-name" content="Dicta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dicta" />
    <title>Dicta Access</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #111827;
      }
      main {
        width: min(92vw, 360px);
        padding: 24px;
        border: 1px solid #d7dce3;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 20px;
        color: #4b5563;
        line-height: 1.5;
      }
      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        color: #374151;
      }
      input {
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
      }
      button {
        width: 100%;
        min-height: 42px;
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #b91c1c;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dicta</h1>
      <p>Enter the app password to continue.</p>
      <form id="login-form">
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button type="submit">Unlock</button>
        <div id="error" class="error" role="status"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const password = document.getElementById('password');
      const error = document.getElementById('error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password.value }),
        });
        if (!response.ok) {
          error.textContent = 'Invalid password.';
          return;
        }
        const next = new URLSearchParams(window.location.search).get('next') || '/';
        window.location.href = next;
      });
    </script>
  </body>
</html>
